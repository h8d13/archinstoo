# Minimal live UKI with archinstoo on it. Build with isos/UKIMOD, boot with
# A2_UKI=isos/a/archinstoo.efi ./TVM. Runtime deps come from installer/PKGBUILD
# through mkosi.conf.d/ (generated by UKIMOD, git-ignored).
[Distribution]
Distribution=arch

[Output]
Format=uki
OutputDirectory=../a
Output=archinstoo

[Content]
Packages=
	linux
	archlinux-keyring
	iproute2
	iputils
WithDocs=no
Autologin=yes
RootPassword=root
KernelCommandLine=console=tty0 console=ttyS0,115200
# the checkout itself, run as: cd /root/archinstoo && python -m archinstoo
ExtraTrees=../../installer:/root/archinstoo

[Build]
Incremental=yes
CacheDirectory=mkosi.cache
