# Minimal live UKI with archinstoo on it. Build with isos/UKIMOD, boot with
# A2_UKI=isos/a/archinstoo.efi ./TVM. Runtime deps come from installer/PKGBUILD
# through mkosi.conf.d/ (generated by UKIMOD, git-ignored).
[Distribution]
Distribution=arch

[Output]
Format=uki
OutputDirectory=../a
Output=archinstoo

[Content]
Packages=
	linux
	archlinux-keyring
	iproute2
	iputils
WithDocs=no
Hostname=archinstoo
# screen autologin (getty@tty1), ttyS0 gets a plain login: for ./TSER login -p root
Autologin=yes
RootPassword=root
# tty0 last = /dev/console on screen, firstboot would otherwise block boot
# with an interactive timezone prompt there
KernelCommandLine=console=ttyS0,115200 console=tty0 systemd.firstboot=off
# the checkout itself, run as: cd /root/archinstoo && python -m archinstoo
ExtraTrees=../../installer:/root/archinstoo

[Build]
Incremental=yes
CacheDirectory=mkosi.cache
