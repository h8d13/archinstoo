# dev cache: what the TSER unattended runs pull every time. Top-level names only,
# ISOMOD_CACHE closes over deps with pactree. Build with:
#   A2_CACHING=1 A2_ISO_PROFILE=ISOMOD_CACHE_DEV ./isos/ISOMOD
# [local_repo] sits before [core], so these versions win until the ISO is rebuilt.

# base install (installer.__base_packages__, kernels, keyring)
base
mkinitcpio
linux
linux-lts
archlinux-keyring

# bootloaders
efibootmgr
grub
limine
refind

# disk features exercised by the tests
btrfs-progs
snapper
grub-btrfs
inotify-tools
lvm2
zram-generator

# vm_unattended.json defaults: network, privilege, apps
iwd
sudo
opendoas
vi
alacritty
bottom
tree

# guest integration (vm-guest branch)
qemu-guest-agent
spice-vdagent

# handy on the target while debugging
python
git

