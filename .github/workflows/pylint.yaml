on:
    push:
        # docs-only pushes, docs.yaml covers those
        paths-ignore:
            - '**.md'
            - mkdocs.yaml
            - .github/overrides/**
            - .github/docs-requirements.txt
name: Pylint linting
permissions: {}
jobs:
    pylint:
        runs-on: ubuntu-latest
        container:
            image: archlinux/archlinux:latest@sha256:e8c39206bbfe6b4e0edc5024c818b76fe372fa509789249ff4b1b41227ada621
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Prepare arch
              run: |
                pacman-key --init
                pacman --noconfirm -Sy archlinux-keyring
                pacman --noconfirm -Syyu
                pacman --noconfirm -Sy python-pip python-pyparted pkgconfig gcc
            - run: pip install --break-system-packages --upgrade pip
            - name: Install Pylint
              run: pip install --break-system-packages ./installer[dev]
            - run: python --version
            - run: pylint --version
            - name: Lint with Pylint
              run: pylint --rcfile=installer/pyproject.toml installer/archinstoo
