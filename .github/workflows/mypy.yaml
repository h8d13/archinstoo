on:
    push:
        # docs-only pushes, docs.yaml covers those
        paths-ignore:
            - '**.md'
            - mkdocs.yaml
            - .github/overrides/**
            - .github/docs-requirements.txt
name: Mypy type checking
permissions: {}
jobs:
    mypy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: installer
        container:
            image: archlinux/archlinux:latest@sha256:f9e436f35af0ca4fcd33839ae6138030342625473db4b4d1da4c6b158b37a0f9
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Prepare arch
              run: |
                pacman-key --init
                pacman --noconfirm -Sy archlinux-keyring
                pacman --noconfirm -Syyu
                pacman --noconfirm -Sy python-pip python-pyparted pkgconfig gcc
            - run: pip install --break-system-packages --upgrade pip
            # this will install the exact version of mypy that is in the pyproject.toml file
            - name: Install archinstoo dependencies
              run: pip install --break-system-packages .[dev]
            - run: python --version
            - run: mypy --version
            - name: run mypy
              run: mypy
