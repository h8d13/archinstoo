name: Release

on:
  push:
    branches: [ master ]
    paths:
      - 'PKGBUILD'

permissions: {}

jobs:
  # paths: fires on any PKGBUILD edit (comments, deps), only release on a bump
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pkgver/pkgrel against previous master
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # unknown before (first push, force push): release
          if git fetch --depth=1 origin "$BEFORE"; then
            git show "$BEFORE:PKGBUILD" > /tmp/PKGBUILD.before
          else
            : > /tmp/PKGBUILD.before
          fi
          grep -E '^pkg(ver|rel)=' /tmp/PKGBUILD.before > /tmp/ver.before || true
          grep -E '^pkg(ver|rel)=' PKGBUILD > /tmp/ver.after
          if cmp -s /tmp/ver.before /tmp/ver.after; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/ver.before /tmp/ver.after

  release:
    needs: check
    if: needs.check.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version info
        run: |
          PKGVER=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)
          PKGREL=$(grep -E '^pkgrel=' PKGBUILD | cut -d= -f2)
          echo "VER=v${PKGVER}-${PKGREL}" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "PKGVER=${PKGVER}" >> "$GITHUB_ENV"
          echo "PKGREL=${PKGREL}" >> "$GITHUB_ENV"

      - name: Create release archive
        run: |
          tar --exclude='.git' -czf "/tmp/archinstoo-${VER}-${SHA}.tar.gz" \
            -C "$GITHUB_WORKSPACE" .

      # after the tar so the archive stays an untouched checkout. same stamp
      # PKGBUILD build() applies, plus pyproject so the wheel name/pip metadata
      # carry the version (0.0.0 would make pip skip upgrades between releases)
      - name: Build stamped wheel
        run: |
          sed -i "s/^version = \"0.0.0\"/version = \"${PKGVER}\"/" installer/pyproject.toml
          sed -i "s/^__pkgstamp__ = '[^']*'/__pkgstamp__ = '${PKGVER}-${PKGREL}'/" installer/archinstoo/_version.py
          pip install build
          python -m build --wheel installer

      # installer/PKGBUILD is a -git package: it clones master HEAD in a clean
      # chroot, so the pkg matches an AUR install and never touches this checkout.
      # extra-x86_64-build needs Arch + devtools + a privileged chroot, hence the
      # container. --tmpfs /run lets arch-nspawn clean up its mounts; the rest of
      # the container workarounds live in build-pkg.sh. Output is
      # archinstoo-git-r<count>.<sha>-any.pkg.tar.zst.
      - name: Build pacman package (clean chroot)
        run: |
          mkdir -p /tmp/pkgout
          docker run --rm --privileged \
            --tmpfs /run \
            -v "$GITHUB_WORKSPACE/.github/build-pkg:/build-pkg:ro" \
            -v "$GITHUB_WORKSPACE/installer/PKGBUILD:/pkg/PKGBUILD:ro" \
            -v /tmp/pkgout:/out \
            archlinux:base-devel bash /build-pkg
          ls -l /tmp/pkgout

      # tag deleted on its own too: an orphan tag from a failed run would
      # otherwise pin create to the old sha
      - name: Publish rolling latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" || true
          gh release create latest --target "$GITHUB_SHA" --latest \
            --title "$VER" \
            --notes "Changelog: [here](https://github.com/${GH_REPO}/blob/master/.github/CHANGELOG.md)" \
            "/tmp/archinstoo-${VER}-${SHA}.tar.gz" \
            installer/dist/*.whl \
            /tmp/pkgout/*.pkg.tar.zst
