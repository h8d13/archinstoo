name: Build archinstoo

on:
  push:
    # docs-only pushes, docs.yaml covers those
    paths-ignore:
      - '**.md'
      - mkdocs.yaml
      - .github/overrides/**
      - .github/docs-requirements.txt

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare fedora
        run: dnf -y install python3-setuptools python3-pip python3-build python3-pyparted
      - name: Build archinstoo
        run: python -m build --wheel installer
      - name: Install archinstoo
        run: pip install installer/dist/*.whl --no-deps
      - name: Run archinstoo
        run: |
          python -V
          archinstoo --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archinstoo
          path: installer/dist/*
