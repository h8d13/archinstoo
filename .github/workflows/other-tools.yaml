on:
    push:
        # docs-only pushes, docs.yaml covers those
        paths-ignore:
            - '**.md'
            - mkdocs.yaml
            - .github/overrides/**
            - .github/docs-requirements.txt
name: Other tools
permissions: {}
jobs:
    # both from the Arch repos, like the pre-commit hooks
    zizmor:
        runs-on: ubuntu-latest
        container:
            image: archlinux/archlinux:latest@sha256:c012199d5d54760078f77b62bf2b7ed15334c873e27cc9d45b13d1e8f6e1ee5c
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                # nothing here pushes, so don't leave the token in .git/config
                persist-credentials: false
            - name: Prepare arch
              run: |
                pacman-key --init
                pacman --noconfirm -Sy archlinux-keyring
                pacman --noconfirm -Syyu
                pacman --noconfirm -S --needed zizmor
            - name: Audit workflow security
              run: zizmor --offline .github/workflows
    vulture:
        runs-on: ubuntu-latest
        container:
            image: archlinux/archlinux:latest@sha256:c012199d5d54760078f77b62bf2b7ed15334c873e27cc9d45b13d1e8f6e1ee5c
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                persist-credentials: false
            - name: Prepare arch
              run: |
                pacman-key --init
                pacman --noconfirm -Sy archlinux-keyring
                pacman --noconfirm -Syyu
                pacman --noconfirm -S --needed vulture
            - name: Check for dead code
              continue-on-error: true
              working-directory: installer
              run: vulture archinstoo
