on:
    push:
        # docs-only pushes, docs.yaml covers those
        paths-ignore:
            - '**.md'
            - mkdocs.yaml
            - .github/overrides/**
            - .github/docs-requirements.txt
name: Alpine minimal
permissions: {}
jobs:
    # steps in alpine.sh, which also runs locally under podman (see its header)
    # arm64 runner: alpine's aarch64 image, so the bootstrap takes the Arch
    # Linux Ports tarball (gpg-only, port key) and pacstraps an aarch64 target
    minimal:
        name: minimal (${{ matrix.runner }})
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-latest, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        container:
            image: alpine:edge
            options: --privileged
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Bootstrap install, verify target
              run: sh .github/workflows/alpine.sh
