on:
    push:
        # docs-only pushes, docs.yaml covers those
        paths-ignore:
            - '**.md'
            - mkdocs.yaml
            - .github/overrides/**
            - .github/docs-requirements.txt
name: Pytest test validation
permissions: {}
jobs:
    pytest:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: installer
        container:
            image: archlinux/archlinux:latest@sha256:c012199d5d54760078f77b62bf2b7ed15334c873e27cc9d45b13d1e8f6e1ee5c
            options: --privileged
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Prepare arch
              run: |
                pacman-key --init
                pacman --noconfirm -Sy archlinux-keyring
                pacman --noconfirm -Syyu
                pacman --noconfirm -S --needed python-pyparted python-pytest
            # python -m: installer/ on sys.path, nothing to pip install
            - name: Test with pytest
              run: python -m pytest
