on:
    push:
        # docs-only pushes, docs.yaml covers those
        paths-ignore:
            - '**.md'
            - mkdocs.yaml
            - .github/overrides/**
            - .github/docs-requirements.txt
name: Pytest test validation
permissions: {}
jobs:
    pytest:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: installer
        container:
            image: archlinux/archlinux:latest@sha256:86092797e32aa19d3f45a831b2873cf557c21c5280e9d197ca7a43c8ea79bcd3
            options: --privileged
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Prepare arch
              run: |
                pacman-key --init
                pacman --noconfirm -Sy archlinux-keyring
                pacman --noconfirm -Syyu
                pacman --noconfirm -Sy python-pip python-pyparted pkgconfig gcc
            - run: pip install --break-system-packages --upgrade pip
            - name: Install archinstoo dependencies
              run: pip install --break-system-packages .[dev]
            - name: Test with pytest
              run: pytest
