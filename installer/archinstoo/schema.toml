# schema.toml - generated, do not edit.
#
# The package sets an archinstoo install can pull, flattened out of the code
# that installs them. Read by scripts/_resolve.py (count, size) and by
# nvchecker/NVGEN, neither of which should have to guess.
#
# Sections follow the order the install runs them, banners naming the call in
# scripts/guided.py:perform_installation. Every section is a table so
# that order survives: a top-level `key = [...]` after the first [header] would
# silently nest under it. A section that is one flat list holds it under
# `packages`, or `profiles` where the names are profiles rather than packages.
#
# To change what a section holds, change the codepath named above it, then:
#
#     python -m archinstoo --script schema

# -- Installer --
[base]
packages = ["base", "mkinitcpio"]

# `vendor` reads the saved config, `full` adds optdeps matched to host PCI/USB IDs
[firmware]
full = ["linux-firmware"]
minimal = []
vendor = []

# carried over when the live ISO had them active
[accessibility]
packages = ["brltty", "espeakup", "alsa-utils"]

# -- minimal_installation --
[lvm]
packages = ["lvm2"]

# e2fsprogs and dosfstools are in base
[filesystem_tools]
bcachefs = ["bcachefs-tools"]
btrfs = ["btrfs-progs"]
f2fs = ["f2fs-tools"]
xfs = ["xfsprogs"]

# dkms: every kernel also pulls its -headers
[bcachefs_extra]
packages = ["bcachefs-dkms"]

# sd-encrypt needs it present at initramfs build; never in a saved config
[fido2]
packages = ["libfido2"]

# none in a VM
[microcode]
amd = ["amd-ucode"]
intel = ["intel-ucode"]

# a `ter-` console font
[ter_fonts]
packages = ["terminus-font"]

# -- setup_swap --
# a hibernation swapfile needs nothing past base
[swap]
zram = ["zram-generator"]

# -- create_users --
# run0 is systemd, only needs polkit
[privilege_escalation]
sudo = ["sudo"]
doas = ["opendoas"]
run0 = ["polkit"]

[stash]
packages = ["git"]

# -- ShellApp --
# bash and rbash ship with base
[shells]
bash = []
zsh = ["zsh"]
fish = ["fish"]
rbash = []

# -- install_applications --
[bluetooth]
packages = ["bluez", "bluez-utils"]

# only offered with a thunderbolt/usb4 controller
[thunderbolt]
packages = ["bolt"]

# by host driver, with either server
[audio_firmware]
sof = ["sof-firmware"]
alsa = ["alsa-firmware"]

[audio]
pipewire = ["pipewire", "pipewire-alsa", "pipewire-jack", "pipewire-pulse", "gst-plugin-pipewire", "libpulse", "wireplumber", "rtkit"]
pulseaudio = ["pulseaudio"]

# the codec half of eos-base-group
[media_codecs]
packages = ["gst-libav", "gst-plugins-bad", "gst-plugins-ugly", "gst-plugin-pipewire", "libdvdcss", "libopenraw"]

# laptops only
[power_management]
power-profiles-daemon = ["power-profiles-daemon"]
tuned = ["tuned", "tuned-ppd"]

# one set; the choice picks which scx binary scx_loader starts
[cpu_scheduler]
packages = ["scx-scheds", "scx-tools"]

# cups drivers render through ghostscript
[printing]
packages = ["cups", "system-config-printer", "cups-pk-helper", "ghostscript"]

[firewalls]
ufw = ["ufw"]
firewalld = ["firewalld"]

[management]
git = ["git"]
openssh = ["openssh"]
wget = ["wget"]
base-devel = ["base-devel"]
man-db = ["man-db"]
pacman-contrib = ["pacman-contrib"]
reflector = ["reflector"]
ntsync-autoload = ["ntsync-autoload"]

[monitors]
htop = ["htop"]
btop = ["btop"]
bottom = ["bottom"]

# EDITOR lands in /etc/environment
[editors]
vi = ["ex-vi-compat"]
nano = ["nano"]
micro = ["micro"]
vim = ["vim"]
neovim = ["neovim"]
emacs = ["emacs"]

# one choice, shared by terminal_profiles; TERMINAL lands in /etc/environment
[terminals]
alacritty = ["alacritty"]
foot = ["foot"]
kitty = ["kitty"]
ghostty = ["ghostty"]
konsole = ["konsole"]
wezterm = ["wezterm"]
xterm = ["xterm"]

[security]
apparmor = ["apparmor"]
firejail = ["firejail"]
bubblewrap = ["bubblewrap"]
fail2ban = ["fail2ban"]
pam-u2f = ["pam-u2f"]
sbctl = ["sbctl"]
audit = ["audit"]

[languages]
rustup = ["rustup"]
go = ["go"]
jdk-openjdk = ["jdk-openjdk"]
nodejs = ["nodejs"]
clang = ["clang"]
zig = ["zig"]
lua = ["lua"]

[devtools]
cmake = ["cmake"]
make = ["make"]
ninja = ["ninja"]
meson = ["meson"]
gdb = ["gdb"]
llvm = ["llvm"]
lld = ["lld"]
lldb = ["lldb"]
perf = ["perf"]
strace = ["strace"]
ltrace = ["ltrace"]
valgrind = ["valgrind"]

# -- setup_btrfs_snapshot --
[snapshots]
snapper = ["snapper"]
timeshift = ["timeshift", "cronie"]

# grub with either snapshot tool
[grub_extra]
packages = ["grub-btrfs", "inotify-tools"]

# -- add_bootloader --
# the UEFI set; refind writes its own entry
[bootloaders]
systemd-boot = ["efibootmgr"]
grub = ["grub", "efibootmgr"]
efistub = ["efibootmgr"]
limine = ["limine", "efibootmgr"]
refind = ["refind"]

# no EFI entry to write; absent here means UEFI only
[bootloaders_bios]
grub = ["grub"]
limine = ["limine"]

# -- install_network_config --
# iwd reads the PSKs carried over from the ISO
[network_iso_extra]
packages = ["iwd"]

# iso and manual use systemd-networkd/resolved from base
[network]
iso = []
nm = ["networkmanager", "wpa_supplicant"]
nm-iwd = ["networkmanager", "iwd"]
iwd = ["iwd"]
manual = []

# NetworkManager tray applet, desktop profiles
[network_desktop_extra]
packages = ["network-manager-applet"]

# -- install_profile_config --
# before desktops: vulkan-driver is virtual
[gfx_drivers]
all-open-source = ["mesa", "xf86-video-amdgpu", "xf86-video-ati", "xf86-video-nouveau", "libva-intel-driver", "intel-media-driver", "vpl-gpu-rt", "libvpl", "vulkan-radeon", "vulkan-intel", "vulkan-nouveau"]
amd-open-source = ["mesa", "xf86-video-amdgpu", "xf86-video-ati", "vulkan-radeon"]
intel-open-source = ["mesa", "libva-intel-driver", "intel-media-driver", "vpl-gpu-rt", "libvpl", "vulkan-intel"]
nvidia-open-kernel = ["nvidia-open", "libva-nvidia-driver"]
nvidia-open-nouveau = ["mesa", "xf86-video-nouveau", "vulkan-nouveau"]
mesa-open-source = ["mesa"]
vm-software = ["mesa", "vulkan-swrast"]
vm-virtio = ["mesa", "vulkan-virtio"]
custom = []

# the custom driver's pool; dkms swap and xorg derived as for presets
[gfx_custom_choices]
packages = ["intel-media-driver", "libva-intel-driver", "libva-nvidia-driver", "mesa", "nvidia-open", "nvidia-prime", "switcheroo-control", "vpl-gpu-rt", "libvpl", "vulkan-intel", "vulkan-mesa-layers", "vulkan-radeon", "vulkan-nouveau", "vulkan-swrast", "vulkan-virtio", "xf86-video-amdgpu", "xf86-video-ati", "xf86-video-nouveau"]

# swapped in on a kernel that needs a dkms build
[gfx_drivers_dkms]
nvidia-open-kernel = ["nvidia-open-dkms", "libva-nvidia-driver", "dkms"]

# vulkan layer for the host GPU
[gfx_mesa_extra]
intel = ["vulkan-intel"]
amd = ["vulkan-radeon"]

# the X11 half, keyed on DisplayServer not the driver
[xorg_extra]
packages = ["xorg-server", "xorg-xinit"]

# profiles that pull xorg_extra
[xorg_profiles]
profiles = ["awesome", "bspwm", "cinnamon", "deepin", "enlightenment", "i3-wm", "lxqt", "mate", "qtile", "xfce4", "xmonad"]

# ship a keybind, no terminal: get the shared choice or the default
[terminal_profiles]
profiles = ["awesome", "dms", "hyprland", "i3-wm", "labwc", "niri", "noctalia", "qtile", "river", "sway"]

# with any top-level profile
[profile_base]
desktop = ["smartmontools", "xdg-utils"]
server = ["smartmontools"]

# a terminal_profiles entry gets its terminal from the shared choice
[profiles]
awesome = ["xorg-server", "awesome", "xorg-xinit", "xorg-xrandr", "feh", "slock", "terminus-font", "gnu-free-fonts", "ttf-liberation", "xsel"]
bspwm = ["bspwm", "sxhkd", "dmenu", "xdo", "rxvt-unicode"]
budgie = ["materia-gtk-theme", "budgie", "konsole", "dolphin", "papirus-icon-theme"]
cinnamon = ["cinnamon", "system-config-printer", "gnome-keyring", "gnome-terminal", "engrampa", "gnome-screenshot", "gvfs-smb", "xed", "xdg-user-dirs-gtk"]
cosmic = ["cosmic", "xdg-user-dirs"]
deepin = ["deepin", "deepin-terminal", "deepin-editor"]
dms = ["niri", "dms-shell-niri", "xdg-desktop-portal-gnome", "xorg-xwayland", "matugen", "cava", "kimageformats", "inter-font", "ttf-fira-code"]
enlightenment = ["enlightenment", "terminology"]
gnome = ["gnome-shell", "gnome-session", "gnome-terminal", "gnome-control-center", "gnome-settings-daemon", "nautilus", "xdg-desktop-portal-gnome", "gnome-tweaks"]
hyprland = ["hyprland", "dunst", "uwsm", "hyprlauncher", "xdg-desktop-portal-hyprland", "qt5-wayland", "qt6-wayland", "hyprpolkitagent", "grim", "slurp", "wl-clipboard"]
i3-wm = ["i3-wm", "i3lock", "i3status", "i3blocks", "xss-lock", "lightdm-gtk-greeter", "lightdm", "dmenu"]
labwc = ["labwc"]
lxqt = ["lxqt", "breeze-icons", "oxygen-icons", "xdg-utils", "gnu-free-fonts", "l3afpad", "slock"]
mate = ["mate", "mate-extra"]
niri = ["niri", "fuzzel", "mako", "xwayland-satellite", "waybar", "swaybg", "swayidle", "swaylock", "xdg-desktop-portal-gnome", "xdg-desktop-portal-gtk"]
noctalia = ["niri", "xdg-desktop-portal-gnome", "xorg-xwayland", "noctalia", "inter-font", "ttf-jetbrains-mono-nerd"]
kde-plasma = ["plasma-desktop", "plasma-pa", "kscreen", "konsole", "kate", "dolphin", "ark", "bluedevil", "plasma-thunderbolt"]
qtile = ["qtile"]
river = ["xdg-desktop-portal-wlr", "river"]
sway = ["sway", "swaybg", "swaylock", "swayidle", "wmenu", "brightnessctl", "grim", "slurp", "pavucontrol", "xorg-xwayland"]
xfce4 = ["xfce4", "xfce4-goodies", "pavucontrol", "gvfs", "xarchiver"]
xmonad = ["xmonad", "xmonad-contrib", "xmonad-extras", "xterm", "dmenu"]
cockpit = ["cockpit", "cockpit-storaged", "cockpit-packagekit"]
docker = ["docker"]
httpd = ["apache"]
java = ["jre-openjdk-headless"]
lighttpd = ["lighttpd"]
mariadb = ["mariadb"]
nginx = ["nginx"]
postgresql = ["postgresql"]
sshd = ["openssh"]
tailscale = ["tailscale"]
tomcat = ["tomcat10"]

# niri is baked into the entry above; <name>_compositor custom_setting swaps it
[compositors.dms]
niri = ["niri", "dms-shell-niri", "xdg-desktop-portal-gnome", "xorg-xwayland"]
hyprland = ["hyprland", "dms-shell-hyprland", "xdg-desktop-portal-hyprland", "uwsm"]

[compositors.noctalia]
niri = ["niri", "xdg-desktop-portal-gnome", "xorg-xwayland"]
hyprland = ["hyprland", "xdg-desktop-portal-hyprland", "uwsm"]
sway = ["sway", "xdg-desktop-portal-wlr", "xorg-xwayland"]
labwc = ["labwc", "xdg-desktop-portal-wlr", "xorg-xwayland"]

# per-profile custom_setting; the value is the package
[seat_access]
seatd = ["seatd"]
logind = ["polkit"]

# each desktop names a default; null is always available
[greeters]
lightdm-gtk-greeter = ["lightdm", "lightdm-gtk-greeter"]
lightdm-slick-greeter = ["lightdm", "lightdm-slick-greeter"]
plasma-login-manager = ["plasma-login-manager"]
sddm = ["sddm"]
gdm = ["gdm"]
ly = ["ly"]
greetd = ["greetd"]
tuigreet = ["greetd", "greetd-tuigreet"]
regreet = ["greetd", "greetd-regreet", "cage"]
cosmic-greeter = ["cosmic-greeter"]

# -- run_grimoire_installation --
# AUR packages are in no repo, nothing can size them
[aur_bootstrap]
packages = ["base-devel", "git"]
